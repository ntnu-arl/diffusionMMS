# Ablation: Larger crop size 720x960
# Changes from baseline_v2: crop [720, 960], batch_size 8
# Expected: more spatial context, better for large objects
experiment_type: "ablation"
experiment_dataset: "goose"
experiment_name: "abl_crop720"

model:
  name: "diffusionmms"
  params:
    timesteps: 3
    bit_scale: 0.01
    accumulation: True
    backbone:
      name: "single_dat_s"
      params:
        frozen_stages: -1
    neck:
      name: 'fpn'
      params:
        out_channels: 256
    decoder:
      name: "DeformableDETRwithTime"
      params:
        num_classes: 64
    aux_head:
      name: "fcn"
      params:
        in_channels: 256
        num_classes: 64
    norm_layer: "BatchNorm2d"
    pretrained: pretrained/upn_dat_s_160k.pth
    train_cfg:
      aux_index: 0
      aux_rate: 0.4
      bn_eps: 1e-3
      bn_momentum: 0.1

train:
  device: cuda
  resume: ~
  batch_size: 8
  num_workers: 16
  drop_last: True
  lr: 6e-5
  lr_power: 0.9
  weight_decay: 0.01
  num_epochs: 200
  warmup_epoch: 10
  warmup_iter: 1500
  train_scale_array: [0.5, 0.75, 1, 1.25, 1.5, 1.75]
  saving_interval: 5
  start_saving_epoch: 100
  eval_last_n_epochs: 20

  dataset:
    params:
      root: "data/goose_dataset"
      split: "train"
    common_transforms:
      semseg_transform:
        params:
          crop_size: [720, 960]
          train_scale_array: [0.5, 0.75, 1, 1.25, 1.5, 1.75]
    transforms:
      to_tensor:
        params: ~
      normalize:
        params:
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]

  opt_name: "adamw"
  use_tensorboard: True
  log_dir: log/
  output_dir: output_dir/

val:
  batch_size: 1
  background: 255
  log_dir: log/eval/
  save_path: ~
  show_image: False
  dataset:
    params:
      root: "data/goose_dataset"
      split: "val"
    common_transforms:
      resize_transform:
        params:
          shorter_side: 480
    transforms:
      to_tensor:
        params: ~
      normalize:
        params:
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
