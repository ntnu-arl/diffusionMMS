# GOOSE dataset config for YOLO segmentation
# Generated for the GOOSE 2D Fine-Grained Semantic Segmentation challenge (CodaBench)
#
# After running convert_dataset.py, update 'path' below to match the output directory.

path: ../data/goose_yolo
train: images/train
val: images/val
test: images/test

# 64 GOOSE classes (class 0 = undefined / void, excluded from training annotations)
nc: 64
names:
  0: undefined
  1: traffic_cone
  2: snow
  3: cobble
  4: obstacle
  5: leaves
  6: street_light
